<svg viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Calendar base -->
  <rect x="25" y="20" width="40" height="35" rx="4" fill="#FF6B6B" stroke="#FF5252" stroke-width="2"/>
  <rect x="27" y="28" width="36" height="25" fill="white"/>

  <!-- Calendar grid -->
  <line x1="29" y1="31" x2="61" y2="31" stroke="#FF6B6B" stroke-width="1" opacity="0.5"/>
  <line x1="29" y1="35" x2="61" y2="35" stroke="#FF6B6B" stroke-width="1" opacity="0.5"/>
  <line x1="29" y1="39" x2="61" y2="39" stroke="#FF6B6B" stroke-width="1" opacity="0.5"/>
  <line x1="29" y1="43" x2="61" y2="43" stroke="#FF6B6B" stroke-width="1" opacity="0.5"/>
  <line x1="29" y1="47" x2="61" y2="47" stroke="#FF6B6B" stroke-width="1" opacity="0.5"/>

  <line x1="35" y1="28" x2="35" y2="51" stroke="#FF6B6B" stroke-width="1" opacity="0.5"/>
  <line x1="42" y1="28" x2="42" y2="51" stroke="#FF6B6B" stroke-width="1" opacity="0.5"/>
  <line x1="49" y1="28" x2="49" y2="51" stroke="#FF6B6B" stroke-width="1" opacity="0.5"/>
  <line x1="56" y1="28" x2="56" y2="51" stroke="#FF6B6B" stroke-width="1" opacity="0.5"/>

  <!-- Calendar rings -->
  <rect x="32" y="15" width="2.5" height="8" rx="1.2" fill="#FF6B6B"/>
  <rect x="53" y="15" width="2.5" height="8" rx="1.2" fill="#FF6B6B"/>

  <!-- Calendar selected dates -->
  <circle cx="38" cy="37" r="2" fill="#FF6B6B"/>
  <circle cx="52" cy="41" r="2" fill="#FFB347"/>

  <!-- Memo notepad -->
  <rect x="55" y="30" width="30" height="35" rx="3" fill="#4A90E2" stroke="#357ABD" stroke-width="2"/>
  <rect x="57" y="32" width="26" height="31" fill="white"/>

  <!-- Memo lines -->
  <line x1="60" y1="37" x2="80" y2="37" stroke="#4A90E2" stroke-width="1.2" opacity="0.6"/>
  <line x1="60" y1="41" x2="80" y2="41" stroke="#4A90E2" stroke-width="1.2" opacity="0.6"/>
  <line x1="60" y1="45" x2="75" y2="45" stroke="#4A90E2" stroke-width="1.2" opacity="0.6"/>
  <line x1="60" y1="49" x2="80" y2="49" stroke="#4A90E2" stroke-width="1.2" opacity="0.6"/>
  <line x1="60" y1="53" x2="72" y2="53" stroke="#4A90E2" stroke-width="1.2" opacity="0.6"/>
  <line x1="60" y1="57" x2="78" y2="57" stroke="#4A90E2" stroke-width="1.2" opacity="0.6"/>

  <!-- Memo corner fold -->
  <path d="M77 30 L77 35 L82 35 Z" fill="#357ABD" opacity="0.4"/>
  <path d="M77 30 L77 35 L82 35" stroke="#357ABD" stroke-width="1" fill="none"/>

  <!-- Pen -->
  <circle cx="75" cy="68" r="3" fill="#FFB347" stroke="#FF9500" stroke-width="1.5"/>
  <rect x="73.5" y="65" width="3" height="3" rx="0.5" fill="#FF9500"/>
  <line x1="75" y1="68" x2="75" y2="65" stroke="#FF6B6B" stroke-width="1"/>

  <!-- Connection line (showing integration) -->
  <path d="M50 40 Q52 45 55 45" stroke="#10B981" stroke-width="2" fill="none" stroke-dasharray="3,2" opacity="0.7"/>


</svg>