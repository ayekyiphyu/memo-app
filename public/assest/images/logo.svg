<svg viewBox="0 0 300 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Calendar icon -->
  <rect x="35" y="35" width="30" height="25" rx="3" fill="#FF6B6B" stroke="#FF5252" stroke-width="2"/>
  <rect x="37" y="42" width="26" height="16" fill="white"/>

  <!-- Calendar grid lines -->
  <line x1="39" y1="44" x2="61" y2="44" stroke="#FF6B6B" stroke-width="1" opacity="0.5"/>
  <line x1="39" y1="48" x2="61" y2="48" stroke="#FF6B6B" stroke-width="1" opacity="0.5"/>
  <line x1="39" y1="52" x2="61" y2="52" stroke="#FF6B6B" stroke-width="1" opacity="0.5"/>

  <line x1="45" y1="42" x2="45" y2="56" stroke="#FF6B6B" stroke-width="1" opacity="0.5"/>
  <line x1="50" y1="42" x2="50" y2="56" stroke="#FF6B6B" stroke-width="1" opacity="0.5"/>
  <line x1="55" y1="42" x2="55" y2="56" stroke="#FF6B6B" stroke-width="1" opacity="0.5"/>

  <!-- Calendar rings -->
  <rect x="42" y="32" width="2" height="6" rx="1" fill="#FF6B6B"/>
  <rect x="56" y="32" width="2" height="6" rx="1" fill="#FF6B6B"/>

  <!-- Selected date dot -->
  <circle cx="53" cy="50" r="2" fill="#FF6B6B"/>

  <!-- Text -->
  <text x="80" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2D3748">Easy</text>
  <text x="80" y="60" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FF6B6B">Go</text>
  <text x="80" y="80" font-family="Arial, sans-serif" font-size="12" fill="#718096" letter-spacing="1px">CALENDAR</text>
</svg>